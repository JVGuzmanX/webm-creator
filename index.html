<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>WebM Creator</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span>PRIVATE, ON-DEVICE PROCESSING</span><h1>WebM Creator</h1><p>Create a slideshow video directly in Edge or Safari. Photos stay on your device.</p></header>
<section class="card"><label class="picker"><input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><b>Select photos</b><small>JPG, PNG, or WebP</small></label><div id="previews"></div>
<div class="grid"><label>Seconds per photo<input id="duration" type="number" min="0.5" max="20" step="0.5" value="2"></label><label>Video size<select id="size"><option value="854:480">480p, fastest</option><option selected value="1280:720">720p</option><option value="1920:1080">1080p</option></select></label><label>Frames per second<select id="fps"><option value="15">15, fastest</option><option selected value="24">24</option><option value="30">30</option></select></label><label>Background<input id="bg" type="color" value="#111827"></label></div>
<button id="create">Create WebM</button><progress id="progress" value="0" max="1"></progress><p id="status">Select photos to begin.</p><video id="result" controls playsinline hidden></video><a id="download" class="download" hidden>Download WebM</a></section>
<p class="note">The first render downloads the FFmpeg browser engine. Keep this page open while creating the video.</p></main><script type="module" src="app.js"></script></body></html>
